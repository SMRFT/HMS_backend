<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | HMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #27ae60;
            --secondary: #2ecc71;
            --dark: #0f1f17;
            --light: #f4fff8;
            --accent: #58d68d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--light);
        }

        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(90px);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.45;
            animation: move 18s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 420px;
            height: 420px;
            background: var(--primary);
            top: -120px;
            left: -100px;
        }

        .blob-2 {
            width: 320px;
            height: 320px;
            background: var(--secondary);
            bottom: -80px;
            right: -60px;
            animation-delay: -4s;
        }

        .blob-3 {
            width: 220px;
            height: 220px;
            background: #7dffb3;
            top: 30%;
            right: 18%;
            animation-delay: -8s;
        }

        @keyframes move {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(60px, 100px) scale(1.15);
            }
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            max-width: 620px;
            width: 92%;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(to bottom, #ffffff, #8dffbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--secondary);
        }

        p {
            font-size: 1.08rem;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.6rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 12px 24px rgba(46, 204, 113, 0.35);
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 32px rgba(46, 204, 113, 0.45);
        }

        .footer {
            margin-top: 2.5rem;
            font-size: 0.92rem;
            color: rgba(255, 255, 255, 0.35);
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem;
            }

            h1 {
                font-size: 6rem;
            }

            h2 {
                font-size: 1.6rem;
            }

            p {
                font-size: 1rem;
            }

            .btn {
                padding: 0.9rem 2rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 4.8rem;
            }

            h2 {
                font-size: 1.35rem;
            }

            .container {
                border-radius: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>

        <p>
            The page you are looking for might have been removed,
            had its name changed, or is temporarily unavailable.
        </p>

        <a href="/" class="btn">Back to Home</a>

        <div class="footer">
            &copy; 2026 Shanmuga Innovations. All rights reserved.
        </div>
    </div>

</body>

</html>
