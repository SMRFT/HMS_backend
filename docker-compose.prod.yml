services:
  backend:
    build: .
    container_name: hms-django
    ports:
      - "2609:2609"
    volumes:
      - .:/app
    environment:
      - DEBUG=0
      - ALLOWED_HOSTS=127.0.0.1,localhost,YOUR_SERVER_IP  # ← உங்கள் server IP போடுங்க
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
